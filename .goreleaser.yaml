version: 2

project_name: upkeep

before:
  hooks:
    - go mod tidy
    - go test ./... -timeout 120s

builds:
  - binary: upkeep
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: upkeep
    repository:
      owner: teknikqa
      name: homebrew-upkeep
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/teknikqa/upkeep"
    description: "A Go CLI tool that keeps your macOS development environment up to date"
    binaries:
      - upkeep

changelog:
  sort: asc
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: "📦 Other Changes"
      order: 999
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: teknikqa
    name: upkeep
  draft: false
  prerelease: auto
