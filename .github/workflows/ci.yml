name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/workflows/**'

  test:
    name: Test (Go ${{ matrix.go-version }})
    needs: changes
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "stable"]
    steps:
      # Gated per-step, not at the job level: a job-level `if` on a matrixed
      # job skips the whole job before the matrix expands, so GitHub can't
      # interpolate ${{ matrix.go-version }} into the check name — it reports
      # one bogus "Test (Go ${{ matrix.go-version }})" context instead of the
      # two required-check names, permanently blocking merges on docs-only
      # PRs. Skipping every step instead keeps the matrix (and its real
      # check names) intact while still short-circuiting the work.
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-go@v7
        if: needs.changes.outputs.code == 'true'
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        if: needs.changes.outputs.code == 'true'
        run: go mod download

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: go build ./...

      - name: Test with coverage
        if: needs.changes.outputs.code == 'true'
        run: go test ./... -timeout 120s -race -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        if: needs.changes.outputs.code == 'true' && matrix.go-version == 'stable'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=50.0
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.code == 'true' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy — run 'go mod tidy'"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.11"

      - name: go vet
        run: go vet ./...

  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check spelling
        uses: crate-ci/typos@master

  vulncheck:
    name: Vulnerability Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
